<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>일본 출장 · OST 녹음 표현집</title>
<style>
  :root {
    --bg: #14161c;
    --card: #1e2129;
    --card-border: #2c303a;
    --accent: #e0a458;
    --accent-dim: #7a5a30;
    --text: #ececec;
    --text-dim: #9a9fab;
    --text-faint: #6b7080;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 90px;
  }
  header {
    padding: 20px 16px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--card-border);
  }
  h1 {
    font-size: 18px;
    margin: 0 0 2px;
    font-weight: 700;
  }
  .sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .search {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    overflow-x: auto;
  }
  .tab {
    flex: none;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--accent);
    color: #14161c;
    border-color: var(--accent);
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 10px 16px 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  .slow-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .slow-toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  main {
    padding: 12px 16px 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 14px 12px;
    margin-bottom: 10px;
  }
  .card .jp {
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card .reading {
    font-size: 12.5px;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .card .ko {
    font-size: 14px;
    color: var(--text-dim);
  }
  .card-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .play-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-dim);
    color: var(--accent);
    border: none;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .play-btn:active { opacity: 0.7; }
  .play-btn.playing { background: var(--accent); color: #14161c; }
  .kanji-card {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .kanji-card .kanji-glyph {
    font-size: 28px;
    font-weight: 700;
    min-width: 44px;
  }
  .kanji-meta { flex: 1; }
  .kanji-meta .reading { margin: 0 0 2px; }
  .kanji-meta .ko { font-size: 14px; }
  .empty {
    text-align: center;
    color: var(--text-faint);
    padding: 40px 20px;
    font-size: 13px;
  }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    padding: 10px;
    background: linear-gradient(transparent, var(--bg) 40%);
  }
</style>
</head>
<body>

<header>
  <h1>🎙️ 일본 출장 · OST 녹음 표현집</h1>
  <div class="sub">회의 · 사무 · 녹음 스튜디오 · 한자</div>
  <input class="search" id="search" type="text" placeholder="검색 (한글/일본어)">
  <div class="tabs" id="tabs"></div>
</header>

<div class="controls">
  <label class="slow-toggle">
    <input type="checkbox" id="slowToggle">
    느리게 재생
  </label>
</div>

<main id="list"></main>

<footer>문구를 눌러 재생 버튼으로 발음을 들어보세요</footer>

const tabsEl = document.getElementById('tabs');
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const slowToggle = document.getElementById('slowToggle');
const categories = Object.keys(DATA);
let activeTab = categories[0];
let jaVoice = null;

function pickVoice() {
  const voices = speechSynthesis.getVoices();
  jaVoice = voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang && v.lang.startsWith('ja')) || null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function speak(text, btn) {
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  if (jaVoice) utter.voice = jaVoice;
  utter.rate = slowToggle.checked ? 0.6 : 1.0;
  if (btn) {
    btn.classList.add('playing');
    utter.onend = () => btn.classList.remove('playing');
  }
  speechSynthesis.speak(utter);
}

function renderTabs() {
  tabsEl.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (cat === activeTab ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeTab = cat; searchEl.value=''; render(); };
    tabsEl.appendChild(btn);
  });
}

function render() {
  renderTabs();
  const q = searchEl.value.trim().toLowerCase();
  const items = DATA[activeTab].filter(item =>
    !q || item.jp.toLowerCase().includes(q) || item.ko.toLowerCase().includes(q) || item.r.toLowerCase().includes(q)
  );
  listEl.innerHTML = '';
  if (!items.length) {
    listEl.innerHTML = '<div class="empty">검색 결과가 없어요</div>';
    return;
  }
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card' + (activeTab === '한자' ? ' kanji-card' : '');
    if (activeTab === '한자') {
      card.innerHTML = `
        <div class="kanji-glyph">${item.jp}</div>
        <div class="kanji-meta">
          <div class="reading">${item.r}</div>
          <div class="ko">${item.ko}</div>
        </div>
      `;
      const btn = document.createElement('button');
      btn.className = 'play-btn';
      btn.innerHTML = '🔊';
      btn.onclick = () => speak(item.jp, btn);
      card.appendChild(btn);
    } else {
      card.innerHTML = `
        <div class="jp">${item.jp}</div>
        <div class="reading">${item.r}</div>
        <div class="ko">${item.ko}</div>
        <div class="card-footer"></div>
      `;
      const btn = document.createElement('button');
      btn.className = 'play-btn';
      btn.innerHTML = '🔊 발음 듣기';
      btn.onclick = () => speak(item.jp, btn);
      card.querySelector('.card-footer').appendChild(btn);
    }
    listEl.appendChild(card);
  });
}

searchEl.addEventListener('input', render);
render();
</script>

</body>
</html>
